<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>UPSC Board Profiler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy masthead band, then a single 1120px working column; cards only for the step panels and documents. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#14213D; --muted:#4D5872; --line:#D9DEE7; --chip:#EAEEF5;
  --accent:#B4430B; --on-accent:#FFFFFF; --accent-soft:#FBEDE4; --accent-ink:#8A3208;
  --band:#14213D; --band-ink:#FFFFFF; --band-muted:#C9D1E3; --band-hi:#F4A06B;
  --good:#1F7A4D; --good-soft:#E2F2E9; --warn:#7A4F00; --warn-soft:#FFF1CF; --bad:#A3261B; --bad-soft:#FBE7E4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --surface:#172036; --ink:#E8ECF4; --muted:#A7B0C4; --line:#2A3550; --chip:#22304D;
  --accent:#F08A4B; --on-accent:#1A1208; --accent-soft:#3A2418; --accent-ink:#F6B48A;
  --band:#0B1020; --band-ink:#FFFFFF; --band-muted:#B5BED3; --band-hi:#F4A06B;
  --good:#5BC48E; --good-soft:#173326; --warn:#F0C060; --warn-soft:#3A2E12; --bad:#F08A80; --bad-soft:#3A1B18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#172036; --ink:#E8ECF4; --muted:#A7B0C4; --line:#2A3550; --chip:#22304D;
  --accent:#F08A4B; --on-accent:#1A1208; --accent-soft:#3A2418; --accent-ink:#F6B48A;
  --band:#0B1020; --band-ink:#FFFFFF; --band-muted:#B5BED3; --band-hi:#F4A06B;
  --good:#5BC48E; --good-soft:#173326; --warn:#F0C060; --warn-soft:#3A2E12; --bad:#F08A80; --bad-soft:#3A1B18;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--band-ink)}
.seal{width:38px;height:38px;border-radius:50%;border:2px solid var(--band-hi);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:var(--band-hi)}
.brand b{font-family:var(--display);font-size:19px;font-weight:700}
.brand small{display:block;font-size:12px;color:var(--band-muted);letter-spacing:.04em}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:var(--band-muted);text-decoration:none;padding:10px 14px;border-radius:8px;font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.nav a[aria-current="page"]{color:var(--band-ink);background:rgba(255,255,255,.12)}
.nav a:hover{color:var(--band-ink)}

main{padding-block:32px 72px}
.view{display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{font-size:18px;color:var(--muted);max-width:62ch}
.h1{font-size:clamp(30px,4.2vw,44px);line-height:1.08;font-weight:800}
.h2{font-size:22px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.steps{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.steps{grid-template-columns:minmax(0,1fr)}}
.stephead{display:flex;align-items:center;gap:12px}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}

.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,textarea.paste,.search input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 11px;min-height:42px}
textarea.paste{min-height:140px;resize:vertical}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}

.choice{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.cta{background:var(--band);color:var(--band-ink);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px}
.cta .btn.primary{width:100%}
.cta p{color:var(--band-muted);font-size:15px}
.cta strong{color:var(--band-ink)}
.prog{display:flex;flex-direction:column;gap:8px;font-size:14px}
.prog div{display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--band-muted);flex:none}
.dot.run{background:var(--band-hi);animation:pulse 1.2s infinite}
.dot.ok{background:#5BC48E}.dot.err{background:#F08A80}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}

/* documents */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 14px;margin-bottom:-1px;font-weight:700;font-size:16px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center;min-height:48px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.docbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.section header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.qlist{list-style:none;margin:0;padding:0;counter-reset:q}
.qlist li{display:grid;grid-template-columns:28px 104px minmax(0,1fr);gap:10px;padding:12px 20px;border-top:1px solid var(--line);counter-increment:q;align-items:baseline}
.qlist li:first-child{border-top:none}
.qlist li::before{content:counter(q);font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.qtype{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.qlist li{grid-template-columns:24px minmax(0,1fr)}.qlist li .qtype{grid-column:2}.qlist li .qt{grid-column:2}}
.filters{display:flex;flex-wrap:wrap;gap:8px}

.bwrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.bwrap{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--band);color:var(--band-ink);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px}
.side p,.side li{color:var(--band-muted);font-size:15px}
.side ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.qcard .q{font-size:17px;font-weight:600;line-height:1.45}
.qcard .meta{font-size:14px;color:var(--muted)}
.qcard .meta b{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.notice{border-radius:var(--radius);padding:14px 16px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.notice.info{background:var(--chip)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

/* library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none;background:var(--chip);color:var(--ink);border:2px solid var(--line)}
.av.big{width:84px;height:84px;font-size:30px;background:var(--band);color:var(--band-hi);border-color:var(--band-hi)}
.av.ph{object-fit:cover;object-position:center top;background:#fff;width:72px;height:72px}
.av.ph.big{width:120px;height:120px;border-width:3px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0}
.facts div{background:var(--bg);border-radius:8px;padding:10px 12px}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who b{font-size:17px;display:block}
.cardfoot{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;font-weight:600}
.stat small{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-direction:column;gap:5px}
.bar .lbl{display:flex;justify-content:space-between;font-size:15px}
.bar .lbl b{font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:4px;background:var(--chip)}
.fill{height:8px;border-radius:4px;background:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.openers{display:flex;flex-direction:column;gap:10px}
.openers blockquote{margin:0;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:15px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.timeline li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:6px}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.timeline li:last-child{padding-bottom:0}
.qrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;align-items:baseline}
.qrow .d{font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.qrow{grid-template-columns:60px minmax(0,1fr)}.qrow .d{grid-column:2}}
.search{display:flex;flex-wrap:wrap;gap:10px}
.search input{flex:1 1 240px}
.search select{flex:0 0 170px;width:auto}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
footer{border-top:1px solid var(--line);padding-block:20px 40px;font-size:13px;color:var(--muted)}
#results{scroll-margin-top:110px}
.txcard p{color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.txbody{max-width:80ch;gap:6px}
.txbody p{margin:0;line-height:1.6;overflow-wrap:anywhere}
.txbody .seat{font-family:var(--body);font-size:15px;font-weight:700;color:var(--accent-ink);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.txbody .seat:first-child{margin-top:0;border-top:none;padding-top:0}
.arcbar{display:flex;flex-wrap:wrap;gap:10px}
.arcbar select{flex:0 1 240px;width:auto}
.arcbar input{flex:1 1 240px;width:auto}
.yearchips{display:flex;flex-wrap:wrap;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<header class="mast">
  <div class="wrap">
    <a class="brand" href="#boards"><span class="seal" aria-hidden="true">PT</span><span><b>UPSC Board Profiler</b><small>Interview boards and transcripts</small></span></a>
    <nav class="nav" aria-label="Main">
      <a href="#boards" data-nav="boards">Board library</a>
      <a href="#archive" data-nav="archive">Transcripts</a>
    </nav>
  </div>
</header>

<main class="wrap">

<!-- LIBRARY -->
<section class="view" id="v-boards" hidden aria-labelledby="h-lib">
  <div class="stack" style="gap:10px">
    <p class="eyebrow">Board library</p>
    <h1 class="h1" id="h-lib">The nine interview boards</h1>
    <p class="lede" id="libLede"></p>
  </div>
  <div class="notice info small" id="memberCheck"></div>
  <div class="grid" id="boardGrid"></div>
  <div class="stack" id="formerWrap" style="gap:14px"></div>
</section>

<!-- PROFILE -->
<section class="view" id="v-board" hidden aria-labelledby="h-board"></section>

<!-- ARCHIVE -->
<section class="view" id="v-archive" hidden aria-labelledby="h-arc">
  <div class="stack" style="gap:10px">
    <p class="eyebrow">Transcript archive</p>
    <h1 class="h1" id="h-arc"><span class="statAll">2,722</span> real interview transcripts, CSE 2020–2025</h1>
    <p class="lede">Search by year, board and keyword.</p>
  </div>
  <div class="arcbar">
    <label class="sr" for="arcYear">Year</label><select id="arcYear"></select>
    <label class="sr" for="arcBoard">Board</label><select id="arcBoard"></select>
    <label class="sr" for="arcQ">Search inside transcripts</label><input id="arcQ" type="search" placeholder="Search inside transcripts, e.g. Kathak, Bihar, AI">
  </div>
  <p class="small muted" id="arcStatus" aria-live="polite"></p>
  <div class="grid" id="arcList"></div>
</section>
<section class="view" id="v-tx" hidden aria-labelledby="h-tx"></section>
</main>

<script id="meta" type="application/json">{"2020": {"Manoj Soni": 35, "Air Marshal Ajit Bhonsle": 34, "": 49, "Sujata Mehta": 41, "M. Sathiyavathy": 30, "Bharat Bhushan Vyas": 40, "TCA Anant": 35, "Smita Nagaraj": 33, "R.N. Choubey": 29}, "2021": {"": 107, "Manoj Soni": 15, "Bharat Bhushan Vyas": 18, "TCA Anant": 36, "R.N. Choubey": 29, "Smita Nagaraj": 27, "M. Sathiyavathy": 31}, "2022": {"M. Sathiyavathy": 85, "R.N. Choubey": 110, "": 59, "Lt Gen Raj Shukla": 78, "Smita Nagaraj": 81, "Preeti Sudan": 91, "Manoj Soni": 61, "TCA Anant": 1}, "2023": {"Dinesh Dasa": 84, "R.N. Choubey": 33, "Lt Gen Raj Shukla": 66, "Suman Sharma": 86, "": 53, "B.B. Swain": 87, "Sheel Vardhan Singh": 38, "Sanjay Verma": 47, "Manoj Soni": 1}, "2024": {"B.B. Swain": 61, "Dinesh Dasa": 80, "Sanjay Verma": 92, "Sheel Vardhan Singh": 111, "": 54, "Suman Sharma": 76, "Lt Gen Raj Shukla": 58, "Preeti Sudan": 6}, "2025": {"Dinesh Dasa": 68, "Sanjay Verma": 71, "Sheel Vardhan Singh": 66, "Anuradha Prasad": 50, "B.B. Swain": 64, "Sujata Chaturvedi": 78, "Lt Gen Raj Shukla": 51, "Ajay Kumar (Chairman)": 8, "Suman Sharma": 56}}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const BY = {}; D.boards.forEach(b => { b.slug = slug(b.short); BY[b.id] = b; });
const TX = {}; D.tx.forEach(t => TX[t[0]] = {id:t[0], b:t[1], d:t[2], k:t[3]});
const Q = D.q.map(r => ({t:r[0], w:r[1], q:r[2], b:TX[r[0]].b, d:TX[r[0]].d, y:2025}));
const conf = n => n >= 20 ? ["High confidence","good"] : n >= 8 ? ["Building","warn"] : ["Low confidence","warn"];
function indexQ(){}
let NQ = Q.length;
/* ---------- archive data ---------- */
const META = JSON.parse(document.getElementById("meta").textContent);   // {year: {board: count}}
const PAST_Q_COUNT = 50914;
const YEARS = [2025, 2024, 2023, 2022, 2021, 2020];
const PAST_YEARS = [2024, 2023, 2022, 2021, 2020];
const TOTAL_TX = YEARS.reduce((a, y) => a + Object.values(META[y] || {}).reduce((s, n) => s + n, 0), 0);
const boardLabel = id => BY[id] ? BY[id].short : (id || "Board not mentioned");
const isFormer = id => id && !BY[id];
const TXC = {};
function loadTx(y){
  if (!TXC[y]) TXC[y] = fetch(`data/tx-${y}.json`).then(r => { if (!r.ok) throw new Error("load"); return r.json(); })
    .then(a => { a.forEach(t => { t.y = y; t.tl = t.t.toLowerCase(); }); return a; })
    .catch(e => { delete TXC[y]; throw e; });
  return TXC[y];
}
let PASTQ = null, PAST_LOADED = false;
function loadPastQ(){
  if (!PASTQ) PASTQ = Promise.all(PAST_YEARS.map(y => fetch(`data/q-${y}.json`).then(r => { if (!r.ok) throw new Error("load"); return r.json(); })
      .then(a => a.map(r => ({t:r[0], b:r[1], d:r[2], w:r[3], q:r[4], y})))))
    .then(parts => { const add = parts.flat(); indexQ(add); Q.push(...add); NQ = Q.length; PAST_LOADED = true; })
    .catch(e => { PASTQ = null; throw e; });
  return PASTQ;
}

/* ---------- transcript formatting ---------- */
const SEAT_CHAIR = /^[\W_]*(?:chair\s*(?:man|person|woman|lady)?|cm|ch|cp)\b[^?]{0,45}$/i;
const SEAT_MEMBER = /^[\W_]*(?:m\s*-?\s*[1-5]|member\s*-?\s*[1-5]|(?:1st|2nd|3rd|4th|5th|first|second|third|fourth|fifth|last)\s*member|lady\s*member|female\s*member|male\s*member)\b/i;
function formatTx(text){
  const raw = text.split("\n"), out = [];
  for (const l0 of raw){
    const l = l0.trim();
    if (!l){ if (out.length && out[out.length-1].k !== "gap") out.push({k:"gap"}); continue; }
    const seat = (SEAT_CHAIR.test(l) && l.length < 60) || (SEAT_MEMBER.test(l) && l.length < 70);
    const prev = out[out.length-1];
    if (!seat && prev && prev.k === "p" && !/[.?!:)\]"”']$/.test(prev.s) && (/^[a-z(]/.test(l) || (prev.s.length > 60 && !/^[\-•*\d]/.test(l)))){ prev.s += " " + l; continue; }
    out.push({k: seat ? "seat" : "p", s: l});
  }
  return out.filter(x => x.k !== "gap").map(x => x.k === "seat" ? `<h3 class="seat">${esc(x.s)}</h3>` : `<p>${esc(x.s)}</p>`).join("");
}
function preview(t, words){
  const txt = t.t.replace(/\s+/g, " ");
  if (words.length){
    const i = t.tl.replace(/\s+/g, " ").indexOf(words[0]);
    if (i >= 0){ const a = Math.max(0, i - 70); return (a ? "…" : "") + txt.slice(a, a + 220) + "…"; }
  }
  const m = txt.match(/(?:chair\w*|chairman sir|chairperson)\s*[:\-]?\s*(.{20,})/i);
  return (m ? m[1] : txt).slice(0, 220) + "…";
}

/* ---------- archive view ---------- */
let arcYear = "2025", arcBoard = "", arcQ = "", arcShown = 40, arcToken = 0;
function boardsFor(yearSel){
  const ys = yearSel === "all" ? YEARS : [+yearSel]; const c = {};
  ys.forEach(y => Object.entries(META[y] || {}).forEach(([b, n]) => c[b] = (c[b] || 0) + n));
  return Object.entries(c).sort((a, b) => (isFormer(a[0]) - isFormer(b[0])) || (!a[0]) - (!b[0]) || b[1] - a[1]);
}
function renderArchiveControls(){
  $("#arcYear").innerHTML = `<option value="all">All years (${TOTAL_TX.toLocaleString("en-IN")})</option>` + YEARS.map(y => `<option value="${y}">CSE ${y} (${Object.values(META[y]).reduce((a, b) => a + b, 0)})</option>`).join("");
  $("#arcYear").value = arcYear;
  const bs = boardsFor(arcYear);
  if (arcBoard && !bs.some(([b]) => (b || "__none") === arcBoard)) arcBoard = "";
  $("#arcBoard").innerHTML = `<option value="">All boards</option>` + bs.map(([b, n]) => `<option value="${esc(b || "__none")}">${esc(boardLabel(b))}${isFormer(b) ? " (former)" : ""} · ${n}</option>`).join("");
  $("#arcBoard").value = arcBoard;
  $("#arcQ").value = arcQ;
}
async function renderArchive(){
  renderArchiveControls();
  const tok = ++arcToken;
  const ys = arcYear === "all" ? YEARS : [+arcYear];
  $("#arcStatus").textContent = ys.length > 1 ? "Loading all six years of transcripts…" : `Loading CSE ${ys[0]} transcripts…`;
  $("#arcList").innerHTML = "";
  let all;
  try { all = (await Promise.all(ys.map(loadTx))).flat(); }
  catch (e){ if (tok === arcToken){ $("#arcStatus").textContent = "Couldn't load the transcripts. Check your connection and try again."; } return; }
  if (tok !== arcToken) return;
  const words = arcQ.toLowerCase().split(/\s+/).filter(w => w.length > 1);
  const list = all.filter(t => (!arcBoard || (arcBoard === "__none" ? !t.b : t.b === arcBoard)) && words.every(w => t.tl.includes(w)));
  $("#arcStatus").textContent = `${list.length.toLocaleString("en-IN")} transcript${list.length === 1 ? "" : "s"}${words.length ? ` containing “${arcQ.trim()}”` : ""}`;
  $("#arcList").innerHTML = list.slice(0, arcShown).map(t => `<a class="card txcard" href="#t-${t.i}">
      <div class="row" style="gap:8px"><span class="tag acc">CSE ${t.y}</span><span class="tag ${isFormer(t.b) ? "" : t.b ? "good" : ""}">${esc(boardLabel(t.b))}${isFormer(t.b) ? " · former" : ""}</span>${t.d ? `<span class="tiny muted">${esc(t.d)}</span>` : ""}</div>
      <p class="small">${esc(preview(t, words))}</p></a>`).join("")
    + (list.length > arcShown ? `<div><button class="btn" type="button" id="arcMore">Show ${Math.min(40, list.length - arcShown)} more</button></div>` : "");
  const m = $("#arcMore"); if (m) m.addEventListener("click", () => { arcShown += 40; renderArchive(); });
}
$("#arcYear").addEventListener("change", e => { arcYear = e.target.value; arcShown = 40; renderArchive(); });
$("#arcBoard").addEventListener("change", e => { arcBoard = e.target.value; arcShown = 40; renderArchive(); });
let arcTimer = null;
$("#arcQ").addEventListener("input", e => { arcQ = e.target.value; arcShown = 40; clearTimeout(arcTimer); arcTimer = setTimeout(renderArchive, 250); });
function openArchive(year, board){ arcYear = String(year); arcBoard = board || ""; arcQ = ""; arcShown = 40; if (location.hash === "#archive") renderArchive(); else location.hash = "archive"; }

/* ---------- reader ---------- */
async function renderReader(id){
  const v = $("#v-tx"); const y = parseInt(id, 10);
  v.innerHTML = `<a href="#archive" style="font-weight:600;text-decoration:none">← All transcripts</a><p class="muted">Loading transcript…</p>`;
  let t;
  try { t = (await loadTx(y)).find(x => x.i === id); } catch (e){ v.innerHTML = `<a href="#archive" style="font-weight:600;text-decoration:none">← All transcripts</a><div class="notice bad">Couldn't load this transcript. Check your connection and try again.</div>`; return; }
  if (!t){ v.innerHTML = `<a href="#archive" style="font-weight:600;text-decoration:none">← All transcripts</a><div class="notice warn">This transcript wasn't found.</div>`; return; }
  const cur = BY[t.b];
  v.innerHTML = `<a href="#archive" style="font-weight:600;text-decoration:none">← All transcripts</a>
    <div class="stack" style="gap:8px"><p class="eyebrow">CSE ${t.y} interview${t.d ? " · " + esc(t.d) : ""}</p>
      <h1 class="h1" id="h-tx" style="font-size:clamp(26px,3.4vw,38px)">${t.b ? esc(boardLabel(t.b)) + " board" : "Board not mentioned"}</h1>
      <div class="row small">${cur ? `<span class="tag good">Current member</span><a href="#board-${cur.slug}" style="font-weight:600">See this board's profile</a>` : t.b ? `<span class="tag">Former member</span>` : ""}</div></div>
    <article class="txbody panel">${formatTx(t.t)}</article>`;
}

/* ---------- library ---------- */
const PHOTO = {"Ajay Kumar (Chairman)":"ajay-kumar","Lt Gen Raj Shukla":"raj-shukla","Suman Sharma":"suman-sharma","B.B. Swain":"bb-swain","Dinesh Dasa":"dinesh-dasa","Sheel Vardhan Singh":"sheel-vardhan-singh","Sanjay Verma":"sanjay-verma","Sujata Chaturvedi":"sujata-chaturvedi","Anuradha Prasad":"anuradha-prasad"};
const DOB = {"Ajay Kumar (Chairman)":"2 Oct 1962","Lt Gen Raj Shukla":"27 Mar 1962","Suman Sharma":"30 Jul 1967","B.B. Swain":"5 Sep 1963","Dinesh Dasa":"29 Mar 1974","Sheel Vardhan Singh":"26 Aug 1963","Sanjay Verma":"28 Jan 1965","Sujata Chaturvedi":"19 Jun 1965","Anuradha Prasad":"23 Jan 1964"};
function avatar(b, big){
  if (PHOTO[b.id]) return `<img class="av ph${big?" big":""}" src="img/${PHOTO[b.id]}.jpg" alt="Photo of ${esc(b.name)}" width="${big?120:72}" height="${big?120:72}" loading="lazy">`;
  return `<span class="av${big?" big":""}" aria-hidden="true">${esc(b.initials)}</span>`;
}
const facts = b => `<dl class="facts"><div><dt>Date of birth</dt><dd>${esc(DOB[b.id] || "—")}</dd></div><div><dt>Holding the post since</dt><dd>${esc(b.from_)}</dd></div><div><dt>${b.id.includes("Chairman") ? "Retires as Chairman" : "Retires as Member"}</dt><dd>${esc(b.until)}</dd></div></dl>`;
const RETIRE_SOON = b => /2027/.test(b.until);
const allN = id => YEARS.reduce((a, y) => a + ((META[y] || {})[id] || 0), 0);
const firstYear = id => Math.min(...YEARS.filter(y => (META[y] || {})[id]));
function renderLibrary(){
  $("#libLede").textContent = `Interview patterns are built from ${D.tx.length} CSE 2025 transcripts; question lists also draw on ${TOTAL_TX.toLocaleString("en-IN")} transcripts from CSE 2020–2025. IFoS interviews and duplicate reposts are excluded.`;
  $("#memberCheck").innerHTML = `<b>Membership checked against UPSC's official list.</b>&nbsp;No member has joined or left since May 2025: the Chairman and 8 Members, with 2 seats vacant. Lt Gen Raj Shukla's term ends on 26 Mar 2027 and the Chairman's on 1 Oct 2027, so new members may join during the CSE 2026 interviews.`;
  const ORDER = ["Ajay Kumar (Chairman)","Lt Gen Raj Shukla","Suman Sharma","B.B. Swain","Dinesh Dasa","Sheel Vardhan Singh","Sanjay Verma","Sujata Chaturvedi","Anuradha Prasad"];
  $("#boardGrid").innerHTML = [...D.boards].sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id)).map(b => {
    return `<a class="card" href="#board-${b.slug}"><div class="who">${avatar(b)}<span><b>${esc(b.name)}</b><span class="small muted">${esc(b.role)} · ${esc(b.service.split(",")[0])}</span></span></div>
      <div class="chips">${b.topics.slice(0,3).map(t => `<span class="tag">${esc(t[0])}</span>`).join("")}</div>
      ${RETIRE_SOON(b) ? `<span class="tag warn">Term ends ${esc(b.until)}</span>` : ""}
      <div class="cardfoot"><span>${allN(b.id)} transcripts since ${firstYear(b.id)}</span></div></a>`; }).join("");
  const former = {};
  YEARS.forEach(y => Object.entries(META[y] || {}).forEach(([b, n]) => { if (isFormer(b)) { former[b] = former[b] || {n: 0, ys: []}; former[b].n += n; former[b].ys.push(y); } }));
  $("#formerWrap").innerHTML = `<h2 class="h2">Former board members</h2><p class="small muted">No longer on the Commission. Their transcripts still show how past boards questioned candidates.</p>
    <div class="grid">${Object.entries(former).sort((a, b) => b[1].n - a[1].n).map(([b, f]) => `<button type="button" class="card" data-arc="${esc(b)}" style="text-align:left;cursor:pointer;font:inherit;align-items:flex-start"><b>${esc(b)}</b><span class="small muted">CSE ${Math.min(...f.ys)}${f.ys.length > 1 ? "–" + Math.max(...f.ys) : ""} · ${f.n} transcripts</span><span class="small" style="color:var(--accent);font-weight:600">Read transcripts →</span></button>`).join("")}</div>`;
  $("#formerWrap").querySelectorAll("[data-arc]").forEach(btn => btn.addEventListener("click", () => openArchive("all", btn.dataset.arc)));
}

/* ---------- profile ---------- */
let qSearch = "", qSeat = "All", qYear = "All years", qShown = 60, profTab = "pattern";
function renderProfile(b){
  const v = $("#v-board");
  v.innerHTML = `<a href="#boards" style="font-weight:600;text-decoration:none">← All boards</a>
  <div class="row" style="gap:20px;align-items:center">${avatar(b,true)}<div class="stack" style="gap:6px">
    <h1 class="h1" id="h-board" style="font-size:clamp(28px,3.6vw,40px)">${esc(b.name)}</h1>
    <div class="row small"><span class="muted">${esc(b.role)}${DOB[b.id] ? " · born " + esc(DOB[b.id]) : ""} · in office since ${esc(b.from_)} · retires ${esc(b.until)}</span></div>
    <a href="${esc(b.url)}" target="_blank" rel="noopener" class="small" style="font-weight:600">View official UPSC profile and photo ↗</a></div></div>
  <div class="subtabs" role="tablist" aria-label="Profile sections">
    <button role="tab" data-t="pattern" aria-selected="${profTab==="pattern"}">Interview pattern</button>
    <button role="tab" data-t="career" aria-selected="${profTab==="career"}">Career profile</button>
    <button role="tab" data-t="questions" aria-selected="${profTab==="questions"}">Questions asked (${Q.filter(o=>o.b===b.id).length})</button>
  </div>
  <div id="profBody" class="stack" style="gap:20px"></div>`;
  v.querySelectorAll(".subtabs button").forEach(btn => btn.addEventListener("click", () => { profTab = btn.dataset.t; renderProfile(b); }));
  const body = $("#profBody");
  if (profTab === "pattern"){
    body.innerHTML = `<p class="lede">${esc(b.summary)}</p>
    <div class="stats">
      <div class="stat"><b>${b.n}</b><span>Transcripts</span><small>CSE 2025 interviews</small></div>
      <div class="stat"><b>${b.dur ? "~"+b.dur+" min" : "—"}</b><span>Typical length</span><small>${b.ndur ? "Median of "+b.ndur+" that reported it" : "Not reported"}</small></div>
      <div class="stat"><b>${b.nq}</b><span>Questions per interview</span><small>Chairperson asks ${b.chairshare}%</small></div>
      <div class="stat"><b>${b.intro}%</b><span>Asked to introduce</span><small>“Why civil services” in ${b.why}%</small></div>
      <div class="stat"><b>${b.cordial}%</b><span>Called it cordial</span><small>${b.grill}% mention counter-questions</small></div>
    </div>
    <div class="cols">
      <section class="panel"><h2 style="font-size:19px">How the chairperson questions</h2><ul class="bul">${b.style.map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>
      <section class="panel"><h2 style="font-size:19px">Real opening questions</h2><div class="openers">${b.openers.map(o => `<blockquote>${esc(o)}</blockquote>`).join("")}</div></section>
      <section class="panel"><h2 style="font-size:19px">Topics that came up</h2><p class="tiny muted">Share of interviews where the topic appeared, across all five panel members</p><div class="bars">${b.topics.map(t => `<div class="bar"><div class="lbl"><span>${esc(t[0])}</span><b>${t[1]}%</b></div><div class="track"><div class="fill" style="width:${t[1]}%"></div></div></div>`).join("")}</div></section>
    </div>
    <section class="panel"><h2 style="font-size:19px">Read this board's transcripts</h2><p class="small muted">The pattern above is from CSE 2025. Full transcripts are available for every year this member sat on a board.</p>
      <div class="yearchips">${YEARS.filter(y => (META[y] || {})[b.id]).map(y => `<button type="button" class="chipbtn" data-y="${y}">CSE ${y} · ${META[y][b.id]}</button>`).join("")}</div></section>
    ${b.limited >= 20 ? `<div class="notice warn">${b.limited}% of candidates on this board said little was asked from their DAF. Prepare current affairs as thoroughly as your DAF.</div>` : ""}`;
    body.querySelectorAll("[data-y]").forEach(btn => btn.addEventListener("click", () => openArchive(btn.dataset.y, b.id)));
  } else if (profTab === "career"){
    body.innerHTML = `<div class="cols">
      <section class="panel"><h2 style="font-size:19px">Service</h2>${facts(b)}<p>${esc(b.service)}</p><h3 style="font-size:16px">Education</h3><ul class="bul">${b.education.map(e => `<li>${esc(e)}</li>`).join("")}</ul></section>
      <section class="panel"><h2 style="font-size:19px">Career</h2><ol class="timeline">${b.career.map(c => `<li>${esc(c)}</li>`).join("")}<li><b>${esc(b.role)}</b> since ${esc(b.from_)}</li></ol></section>
      <section class="panel"><h2 style="font-size:19px">Known for</h2><p>${esc(b.known)}</p><p class="small muted">Why this matters: board members often draw on their own field. Read up on the areas above before your interview.</p>
        <p class="tiny muted">Sources: ${b.sources.map(s => `<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(", ")}, and the <a href="${esc(b.url)}" target="_blank" rel="noopener">UPSC profile</a>.</p></section>
    </div>`;
  } else {
    body.innerHTML = `<div class="search"><label class="sr" for="qs">Search questions</label><input id="qs" type="search" placeholder="Search, e.g. cricket, Bihar, AI" value="${esc(qSearch)}">
      <label class="sr" for="qseat">Panel seat</label><select id="qseat">${["All","Chair","Members"].map(s => `<option ${s===qSeat?"selected":""}>${s}</option>`).join("")}</select>
      <label class="sr" for="qyear">Year</label><select id="qyear">${["All years", ...YEARS.filter(y => (META[y] || {})[b.id]).map(String)].map(s => `<option ${s===qYear?"selected":""}>${s}</option>`).join("")}</select></div>
      <div id="qres" class="panel" style="gap:0"></div>`;
    const draw = () => {
      const s = qSearch.toLowerCase();
      const list = Q.filter(o => o.b===b.id && (qYear==="All years" || String(o.y)===qYear) && (qSeat==="All" || (qSeat==="Chair" ? o.w==="Chair" : o.w!=="Chair")) && (!s || o.q.toLowerCase().includes(s)));
      $("#qres").innerHTML = `<p class="small muted" style="padding-bottom:8px">${list.length} questions${PAST_LOADED ? "" : " · loading earlier years…"}</p>` + list.slice(0, qShown).map(o => `<div class="qrow"><span class="tag">${o.w==="Chair"?"Chair":esc(o.w==="Member"?"Member":"Member "+o.w.slice(1))}</span><span>${esc(o.q)}</span><span class="d">CSE ${o.y}${o.d ? " · " + esc(o.d) : ""}</span></div>`).join("")
        + (list.length > qShown ? `<div style="padding-top:12px"><button class="btn" type="button" id="more">Show more</button></div>` : "");
      const m = $("#more"); if (m) m.addEventListener("click", () => { qShown += 60; draw(); });
    };
    $("#qs").addEventListener("input", e => { qSearch = e.target.value; qShown = 60; draw(); });
    $("#qseat").addEventListener("change", e => { qSeat = e.target.value; qShown = 60; draw(); });
    $("#qyear").addEventListener("change", e => { qYear = e.target.value; qShown = 60; draw(); });
    draw();
    if (!PAST_LOADED) loadPastQ().then(() => { if (profTab === "questions" && renderProfile.last === b.id) renderProfile(b); }).catch(() => {});
  }
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1) || "boards";
  const b = h.startsWith("board-") ? D.boards.find(x => "board-"+x.slug === h) : null;
  const view = b ? "board" : h === "archive" ? "archive" : /^t-\d{4}-\d+$/.test(h) ? "tx" : "boards";
  ["boards","board","archive","tx"].forEach(v => $("#v-"+v).hidden = v !== view);
  document.querySelectorAll(".nav a").forEach(a => a.toggleAttribute("aria-current", false));
  const cur = document.querySelector(`.nav a[data-nav="${(view==="archive"||view==="tx")?"archive":"boards"}"]`); if (cur) cur.setAttribute("aria-current","page");
  if (b){ if (renderProfile.last !== b.id){ profTab = "pattern"; qSearch = ""; qSeat = "All"; qYear = "All years"; qShown = 60; } renderProfile.last = b.id; renderProfile(b); }
  if (view === "archive") renderArchive();
  if (view === "tx") renderReader(h.slice(2));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

document.querySelectorAll(".statT").forEach(e => e.textContent = TOTAL_TX.toLocaleString("en-IN")); document.querySelectorAll(".statAll").forEach(e => e.textContent = TOTAL_TX.toLocaleString("en-IN")); document.querySelectorAll(".statN").forEach(e => e.textContent = (D.q.length + PAST_Q_COUNT).toLocaleString("en-IN"));
renderLibrary(); route();
</script>
</body></html>
